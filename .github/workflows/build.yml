name: Build

on:
  push:
    branches: [main, master, rewrite/**]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore src/BattleCity.sln

      - name: Build
        run: dotnet build src/BattleCity.sln --no-restore -c Release

      - name: Test
        run: dotnet test src/BattleCity.sln --no-build -c Release --verbosity normal
